[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insar-risk-zoning"
version = "0.3.2.dev0"
description = "Descriptive Jakarta surface differences with AlphaEarth embeddings and observation-support diagnostics"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=1.26,<2.5",
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
  "hdbscan>=0.8.33",
  "rasterio>=1.4,<2",
  "geopandas>=0.14,<2",
  "pyproj>=3.6,<4",
  "requests>=2.31,<3",
  "shapely>=2.0,<3",
  "matplotlib>=3.6,<4",
  "folium>=0.15,<1",
]

[project.optional-dependencies]
earth-engine = [
  "earthengine-api>=1.1.0",
  "geemap>=0.34.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
insar-risk-zoning = "scripts.run_full_pipeline:cli"

[tool.setuptools.packages.find]
include = ["config*", "src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
